# The shipped (Table 1 / Fig. 2) COBRAS configuration: k-NN abstention radius at k = 32,
# ratio calibration at percentile 0.98, sharpness 200, threshold read off the contrastive
# negatives.  abstain_percentile is swept on the CLI for the Q2 sensitivity table.
type: COBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: 20
  vmf_beta: 0.0
  abstain_percentile: 0.98
  abstain_k: 32
  abstain_sharpness: 200.0
  abstain_on_queries: false
T: 0.65
suffix: ""
name: q1-cobras-knn-ratio-p${steer.kwargs.abstain_percentile}-k${steer.kwargs.abstain_k}-sh${steer.kwargs.abstain_sharpness}-T${steer.T}${steer.suffix}
