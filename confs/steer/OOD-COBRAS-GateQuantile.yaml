# The shipped k-NN statistic, recalibrated: quantile of the score over held-out
# in-distribution prompt activations instead of the (rho/rho_ref)^sharpness sigmoid keyed to
# the contrastive negatives.  Isolates calibration from statistic.
type: AblationCOBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: 20
  vmf_beta: 0.0
  abstain_percentile: 0.9
  abstain_k: 32
  abstain_sharpness: 200.0
  abstain_calibration: quantile
  abstain_on_queries: true
T: 0.65
suffix: ""
name: q1-cobras-knn-quantile-k${steer.kwargs.abstain_k}-cov${steer.kwargs.abstain_percentile}-T${steer.T}${steer.suffix}
