# Shipped COBRAS (extended potentials, adaptive bandwidth) with the abstention gate off, so the
# effect of the potentials/bandwidth choice can be read without the gate on top of it.
type: COBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: 20
  vmf_beta: 0.0
  abstain_percentile: 1.0
T: 0.65

name: q6-shippednogate-T${steer.T}
