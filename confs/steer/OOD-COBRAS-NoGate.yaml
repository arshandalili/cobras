# Paper configuration of COBRAS with the abstention gate removed (abstain_percentile = 1.0
# disables it inside COBRAS.__init__).
type: COBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: 20
  vmf_beta: 0.0
  abstain_percentile: 1.0
T: 0.65
suffix: ""
name: q1-cobras-nogate-vmf${steer.kwargs.vmf_kappa}-T${steer.T}${steer.suffix}
