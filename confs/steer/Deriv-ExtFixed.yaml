# Isolates the two halves of the derivation fix: the Eq. (15)-(16) extended potentials kept, but
# the bandwidth made constant. Ungated, so the gate cannot mask the change.
type: AblationCOBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: 20
  vmf_beta: 0.0
  abstain_percentile: 1.0
  bandwidth: fixed
T: 0.65

name: q6-extfixed-T${steer.T}
