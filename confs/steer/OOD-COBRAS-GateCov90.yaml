# The shipped gate at a looser coverage, for the abstention sensitivity row: the only
# difference from OOD-COBRAS-Gate is abstain_percentile.
type: COBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: 20
  vmf_beta: 0.0
  abstain_percentile: 0.9
  abstain_on_queries: true
T: 0.65
suffix: ""
name: cobras-marginal-cov${steer.kwargs.abstain_percentile}-T${steer.T}${steer.suffix}
