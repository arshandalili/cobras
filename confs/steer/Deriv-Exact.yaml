# Q6 ladder, rung 4: rung 3 plus the abstention gate = shipped COBRAS with the exact
# Riemannian gradient of the SB drift (plain potentials, fixed bandwidth).
type: AblationCOBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: 20
  vmf_beta: 0.0
  abstain_percentile: 0.534
  potentials: plain
  bandwidth: fixed
  drift: gradient
T: 0.65

name: q6-exact-T${steer.T}
