# CAA wrapped in the *identical* abstention gate COBRAS ships (percentile 0.98, k = 32,
# sharpness 200, calibrated on the contrastive negatives), so the only difference from the
# CAA row is the gate.
type: GatedSteer
kwargs:
  base: CAA
  abstain_percentile: 0.98
  abstain_k: 32
  abstain_sharpness: 200.0
  abstain_on_queries: false
  base_kwargs: {}
T: 4
suffix: ""
name: q1-CAA-gate${steer.kwargs.abstain_percentile}-k${steer.kwargs.abstain_k}-sh${steer.kwargs.abstain_sharpness}-T${steer.T}${steer.suffix}
