# Q6 ladder, rung 1: the update as Eq. (13) strictly gives it.
#   potentials: plain  -> Eqs. (10)-(11) with the Sinkhorn potentials of Eq. (8) as constants
#   bandwidth: fixed   -> sigma^2 constant, so Eq. (31) may pull 1/sigma^2 out of the sum
#   drift: gradient    -> keep the 1/sigma^2 prefactor of Eq. (31)
#   step_mode: raw     -> do not unit-normalize the Euler step
#   no vMF gate, no abstention gate
type: AblationCOBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: null
  vmf_beta: 0.0
  abstain_percentile: 1.0
  potentials: plain
  bandwidth: fixed
  step_mode: raw
  drift: gradient
T: 0.65

name: q6-strict-T${steer.T}
