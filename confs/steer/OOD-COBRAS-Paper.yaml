# The configuration Table 1 and the GSM8K panel of Fig. 2 actually ran: T = 0.65, abstention
# percentile 98, k_abs = 32, sharpness 200. The MMLU panel of Fig. 2 was run at a different
# setting (T = 0.5, percentile 0.995, sharpness 50) for all four models, so the two OOD panels
# do not plot the same method. This config exists to re-run MMLU at the shipped setting and
# repair that.
type: COBRAS
kwargs:
  k_bw: 5
  n_sinkhorn: 5
  alpha_sigma: 1.0e-3
  epsilon: 0.0
  max_iters: 10
  vmf_kappa: 20
  vmf_beta: 0.0
  abstain_percentile: 0.534
T: 0.65

name: q0-COBRAS-paper-cov${steer.kwargs.abstain_percentile}-T${steer.T}
